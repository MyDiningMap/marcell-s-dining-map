<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diningmap Budapest</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">🍽️</span>
      <div>
        <h1>Diningmap</h1>
        <p class="subtitle">Kipróbált budapesti éttermeim</p>
      </div>
    </div>
    <div class="actions">
      <button id="btn-add" class="btn primary">+ Új étterem</button>
      <details class="menu">
        <summary class="btn" aria-label="További műveletek">⋯</summary>
        <div class="menu-panel">
          <button id="btn-export" class="menu-item">Mentés fájlba (JSON)</button>
          <label class="menu-item">Betöltés fájlból
            <input id="file-import" type="file" accept="application/json,.json" hidden>
          </label>
          <button id="btn-clear" class="menu-item danger">Minden adat törlése</button>
        </div>
      </details>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <section class="stats" id="stats"></section>

      <section class="filters">
        <input id="f-search" type="search" placeholder="Keresés név, cím, jegyzet…">
        <div class="filter-row">
          <select id="f-cuisine"><option value="">Minden konyha</option></select>
          <select id="f-district"><option value="">Minden kerület</option></select>
        </div>
        <div class="filter-row">
          <select id="f-rating">
            <option value="0">Bármilyen értékelés</option>
            <option value="6">★ 6+</option>
            <option value="7">★ 7+</option>
            <option value="8">★ 8+</option>
            <option value="9">★ 9+</option>
            <option value="10">★ 10</option>
          </select>
          <select id="f-sort">
            <option value="date">Legutóbbi látogatás</option>
            <option value="rating">Legjobb értékelés</option>
            <option value="name">Név (A–Z)</option>
          </select>
        </div>
        <label class="check"><input id="f-return" type="checkbox"> Csak ahová visszamennék</label>
      </section>

      <ul id="list" class="list"></ul>
      <p id="empty" class="empty" hidden>Még nincs étterem a listán. Kattints az <b>+ Új étterem</b> gombra, vagy a térképen egy helyre.</p>
    </aside>

    <section class="map-wrap">
      <div id="map"></div>
    </section>
  </main>

  <div class="pick-banner">Kattints a térképen az étterem helyére (Esc = vissza)</div>

  <dialog id="dlg" class="dialog">
    <form id="form" method="dialog">
      <h2 id="dlg-title">Új étterem</h2>

      <label>Név *
        <input name="name" required autocomplete="off">
      </label>

      <label>Cím
        <div class="inline">
          <input name="address" autocomplete="off" placeholder="pl. Király utca 12.">
          <button type="button" id="btn-geocode" class="btn">Keresés térképen</button>
        </div>
      </label>
      <p class="hint" id="geo-hint">A helyet a cím keresésével vagy a térképen kijelölve adhatod meg.</p>
      <div id="geo-results" class="geo-results"></div>

      <div class="grid2">
        <label>Kerület
          <select name="district" id="district-select"></select>
        </label>
        <label>Konyha
          <input name="cuisine" list="cuisine-list" autocomplete="off" placeholder="pl. magyar, olasz">
          <datalist id="cuisine-list"></datalist>
        </label>
      </div>

      <label><span>Értékelés <span id="rating-value" class="rating-value"></span></span>
        <div class="stars-input" id="stars-input" role="radiogroup" aria-label="Értékelés"></div>
        <input type="hidden" name="rating">
      </label>

      <div class="grid2">
        <label>Árszint
          <select name="price">
            <option value="">–</option>
            <option value="1">Ft (olcsó)</option>
            <option value="2">Ft Ft</option>
            <option value="3">Ft Ft Ft</option>
            <option value="4">Ft Ft Ft Ft (drága)</option>
          </select>
        </label>
        <label>Látogatás dátuma
          <input name="date" type="date">
        </label>
      </div>

      <label class="check">
        <input name="wouldReturn" type="checkbox"> Visszamennék
      </label>

      <label>Mit ettem / jegyzetek
        <textarea name="notes" rows="3"></textarea>
      </label>

      <label>Weboldal / Google Maps link
        <input name="url" type="url" placeholder="https://…">
      </label>

      <input type="hidden" name="lat">
      <input type="hidden" name="lng">
      <div class="coords-row">
        <p class="hint" id="coords"></p>
        <button type="button" id="btn-pick" class="btn small">Kijelölés a térképen</button>
      </div>

      <div class="dialog-actions">
        <button type="button" id="btn-delete" class="btn danger">Törlés</button>
        <span class="spacer"></span>
        <button type="button" id="btn-cancel" class="btn">Mégse</button>
        <button type="submit" class="btn primary">Mentés</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
