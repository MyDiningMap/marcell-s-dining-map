<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marcell's Dining Map</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css?v=20261122f">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">🍽️</span>
      <div>
        <h1>Marcell's Dining Map</h1>
        <p class="subtitle">Budapesti éttermeim, pékségeim és kávézóim</p>
      </div>
    </div>
    <div class="actions">
      <button id="sync" class="sync owner-only" type="button"></button>
      <button id="btn-add" class="btn primary owner-only">+ Új hely</button>
      <details class="menu">
        <summary class="btn" aria-label="További műveletek">⋯</summary>
        <div class="menu-panel">
          <button id="btn-login" class="menu-item readonly-only">🔒 Belépés szerkesztéshez</button>
          <button id="btn-export" class="menu-item owner-only">Mentés fájlba (JSON)</button>
          <label class="menu-item owner-only">Betöltés fájlból
            <input id="file-import" type="file" accept="application/json,.json" hidden>
          </label>
          <button id="btn-clear" class="menu-item danger owner-only">Minden adat törlése</button>
          <button id="btn-logout" class="menu-item owner-only">Kilépés a szerkesztő módból</button>
        </div>
      </details>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <nav class="tabs" id="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="visited">Kipróbált <span class="count" id="cnt-visited">0</span></button>
        <button class="tab" role="tab" data-tab="wishlist">♡ Kívánságlista <span class="count" id="cnt-wishlist">0</span></button>
        <button class="tab" role="tab" data-tab="all">Mind <span class="count" id="cnt-all">0</span></button>
      </nav>

      <section class="filters">
        <input id="f-search" type="search" placeholder="Keresés név, cím, jegyzet…">
        <div class="filter-row">
          <select id="f-type"><option value="">Minden típus</option></select>
          <select id="f-cuisine"><option value="">Minden konyha</option></select>
        </div>
        <label class="check visited-only"><input id="f-return" type="checkbox"> Csak ahová visszamennék</label>
      </section>

      <ul id="list" class="list"></ul>
      <p id="empty" class="empty" hidden></p>
    </aside>

    <section class="map-wrap">
      <div id="map"></div>
    </section>
  </main>

  <div class="pick-banner">Kattints a térképen a hely pontjára (Esc = vissza)</div>

  <dialog id="dlg" class="dialog">
    <form id="form" method="dialog">
      <h2 id="dlg-title">Új hely</h2>

      <div class="seg" id="status-seg" role="group" aria-label="Státusz">
        <button type="button" data-status="visited">✓ Kipróbáltam</button>
        <button type="button" data-status="wishlist">♡ Kívánságlista</button>
      </div>
      <input type="hidden" name="status">

      <label>Név *
        <input name="name" required autocomplete="off">
      </label>

      <div class="grid2">
        <label>Típus
          <select name="type" id="type-select"></select>
        </label>
        <label>Kerület
          <select name="district" id="district-select"></select>
        </label>
      </div>

      <label>Cím
        <div class="inline">
          <input name="address" autocomplete="off" placeholder="pl. Király utca 12.">
          <button type="button" id="btn-geocode" class="btn">Keresés térképen</button>
        </div>
      </label>
      <p class="hint" id="geo-hint">A helyet a cím keresésével vagy a térképen kijelölve adhatod meg.</p>
      <div id="geo-results" class="geo-results"></div>

      <div class="grid2">
        <label>Konyha / kínálat
          <input name="cuisine" list="cuisine-list" autocomplete="off" placeholder="pl. magyar, olasz">
          <datalist id="cuisine-list"></datalist>
        </label>
        <label>Árszint
          <select name="price">
            <option value="">–</option>
            <option value="1">Ft (olcsó)</option>
            <option value="2">Ft Ft</option>
            <option value="3">Ft Ft Ft</option>
            <option value="4">Ft Ft Ft Ft (drága)</option>
          </select>
        </label>
      </div>

      <div class="visited-only">
        <label><span>Értékelés <span id="rating-value" class="rating-value"></span></span>
          <div class="stars-input" id="stars-input" role="radiogroup" aria-label="Értékelés"></div>
          <input type="hidden" name="rating">
        </label>
        <label class="check">
          <input name="wouldReturn" type="checkbox"> Visszamennék
        </label>
      </div>

      <label>Jegyzetek
        <textarea name="notes" rows="3"></textarea>
      </label>

      <label>Weboldal / Google Maps link
        <input name="url" type="url" placeholder="https://…">
      </label>

      <input type="hidden" name="lat">
      <input type="hidden" name="lng">
      <div class="coords-row">
        <p class="hint" id="coords"></p>
        <button type="button" id="btn-pick" class="btn small">Kijelölés a térképen</button>
      </div>

      <div class="dialog-actions">
        <button type="button" id="btn-delete" class="btn danger">Törlés</button>
        <span class="spacer"></span>
        <button type="button" id="btn-cancel" class="btn">Mégse</button>
        <button type="submit" class="btn primary">Mentés</button>
      </div>
    </form>
  </dialog>

  <dialog id="login-dlg" class="dialog">
    <form id="login-form">
      <h2>Belépés szerkesztéshez</h2>
      <input id="login-token" type="password" autocomplete="off" placeholder="Token" aria-label="Token" required>
      <p class="login-error" id="login-error" role="alert"></p>
      <div class="dialog-actions">
        <span class="spacer"></span>
        <button type="button" id="login-cancel" class="btn">Mégse</button>
        <button type="submit" id="login-submit" class="btn primary">Belépés</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.1.3/leaflet-maplibre-gl.js"></script>
  <script src="app.js?v=20261122f"></script>
</body>
</html>
